name: Build plugins

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        shell: bash
        run: |
          T=$(find build -type f \( -name dsp_tests -o -name dsp_tests.exe \) | head -1)
          "$T"

      - name: Build macOS installer (.pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          ROOT="$RUNNER_TEMP/pkgroot"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components"
          cp -R build/*/*_artefacts/Release/VST3/*.vst3 "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R build/*/*_artefacts/Release/AU/*.component "$ROOT/Library/Audio/Plug-Ins/Components/"
          # ad-hoc sign the bundles so Apple Silicon hosts will load them
          for b in "$ROOT"/Library/Audio/Plug-Ins/*/*; do codesign --force --deep --sign - "$b"; done
          # install exactly where we say (don't let Installer relocate the bundles)
          pkgbuild --analyze --root "$ROOT" "$RUNNER_TEMP/comp.plist"
          i=0; while /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" "$RUNNER_TEMP/comp.plist" 2>/dev/null; do i=$((i+1)); done
          mkdir -p installer
          pkgbuild --root "$ROOT" --component-plist "$RUNNER_TEMP/comp.plist" \
            --identifier "com.roundcorneraudio.warpedvinylhifi" --version "1.0.0" --install-location / \
            "installer/Warped-Vinyl-HiFi-macOS.pkg"
          ls -la installer

      - name: Verify installer on the runner (install + Apple auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          pkgutil --payload-files installer/*.pkg
          sudo installer -pkg installer/*.pkg -target /
          ls -la /Library/Audio/Plug-Ins/VST3 /Library/Audio/Plug-Ins/Components
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i Rcna || true
          auval -strict -v aufx Wvhf Rcna

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: WarpedVinylHiFi-macOS-Installer
          path: installer

      - name: Publish .pkg as a GitHub Release (direct download)
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest macOS installer
          body: |
            Download the .pkg below, double-click it, then allow it in System Settings > Privacy & Security > Open Anyway.
            Installs the AU and VST3 into /Library/Audio/Plug-Ins. Built from ${{ github.sha }}.
          make_latest: true
          files: installer/*.pkg

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find build -type d \( -name "*.vst3" -o -name "*.component" \) -path "*Release*" -prune -exec cp -R {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WarpedVinylHiFi-${{ matrix.name }}
          path: dist
